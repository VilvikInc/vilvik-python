[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vilvik"
version = "0.2.1"
description = "Official Python SDK for the Vilvik genetic-algorithm cloud API."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Vilvik", email = "ahmed.f.gad@gmail.com" }]
keywords = ["genetic-algorithm", "optimization", "pygad", "vilvik"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "requests>=2.28",
]

[project.optional-dependencies]
async = ["httpx>=0.24"]
dev = [
    "pytest>=7",
    "pytest-cov>=4",
    "responses>=0.23",
]

[project.scripts]
vilvik = "vilvik.__main__:main"

[project.urls]
Homepage = "https://vilvik.com"
Documentation = "https://vilvik.com/docs"
Repository = "https://github.com/VilvikInc/vilvik-python"
Issues = "https://github.com/VilvikInc/vilvik-python/issues"

[tool.setuptools.packages.find]
include = ["vilvik*"]
exclude = ["tests*"]
